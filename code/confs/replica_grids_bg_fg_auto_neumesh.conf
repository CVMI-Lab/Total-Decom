train{
    expname = replica_grids_bg_fg_auto_neumesh
    dataset_class = datasets.scene_dataset_bg_fg_neumesh.SceneDatasetDN
    model_class = model.network.NeuMeshNetwork
    loss_class = model.loss.NeuMeshLoss
    learning_rate = 5.0e-4
    lr_factor_for_grid = 20.0
    num_pixels = 1024
    checkpoint_freq = 100
    plot_freq = 50
    split_n_pixels = 1024
    max_total_iters = 300000
}
plot{
    plot_nimgs = 1
    resolution = 512
    grid_boundary = [-1.0, 1.0]
}
loss{
    rgb_loss = torch.nn.L1Loss
    depth_weight = 0.1
}
dataset{
    data_dir = Replica
    img_res = [384, 384]
    scan_id = 1
    use_mask = True
    center_crop_type = no_crop 
}
model{
    feature_vector_size = 256
    scene_bounding_sphere = 1.0
    
    Grid_MLP = True

    implicit_network
    {
        d_in = 3
        d_out = 2
        dims = [256, 256]
        geometric_init = True
        bias = 0.6
        skip_in = [4]
        weight_norm = True
        multires = 6
        inside_outside = True
        use_grid_feature = True
        divide_factor = 1.0 
        # sphere_scale = 100
        # sigmoid = 10
    }

    rendering_network
    {
        mode = idr 
        d_in = 9 
        d_out = 3
        dims = [256, 256]
        weight_norm = True
        multires_view = 4
        per_image_code = True
    }
    
    sem_network
    {
        din = 256
        label_dim = 3
        weight_norm = True
    }

    feature_network
    {
        d_in = 3
        d_out = 256
        dims = [256, 256]
        weight_norm = True
        multires = 6
        divide_factor = 1.0 
    }

    density
    {
        params_init{
            beta = 0.1
        }
        beta_min = 0.0001
    }
    ray_sampler
    {
        near = 0.0
        N_samples = 64 
        N_samples_eval = 128 
        N_samples_extra = 32 
        eps = 0.1
        beta_iters = 10
        max_total_iters = 5
    }

    neumesh
    {
        D_density = 3
        D_color = 4
        color_dim = 32
        geometry_dim = 32
        multires_d = 8
        multires_fg = 2
        multires_ft = 2
        multires_view = 4
        mesh_path = ../exps/replica_grids_bg_fg_auto_sdf_loss_gt_no_sphere_12/2023_08_11_01_13/plots/surface_1800.ply

        N_samples = 64 
        N_samples_importance = 64 
        N_upsample_iters = 4
        density
        {
            params_init{
                beta = 0.1
            }
            beta_min = 0.0001
        }
    }
}
