### Input
# input rgba image path (default to None, can be load in GUI too)
data_dir: ../data/Replica
img_H: 384
img_W: 384

### Output
outdir: logs
mesh_format: ply
save_path: total_decom

scan_id: 1

### Training
# training batch size per iter
batch_size: 1
# training iterations for stage 1
epochs: 500
# training camera radius
radius: 1
# training camera elevation
elevation: 0.4
# training camera fovy
fovy: 49.1
# checkpoint to load for stage 1 (should be a ply file)
load: ../code/exps/replica/plots/surface_2000.ply
foreground_mesh: ../code/exps/replica/plots/surface_2000_0.ply
vertex_features: ../code/exps/replica/plots/vertex_features.pt
sam_checkpoint: sam_checkpoints/sam_vit_h_4b8939.pth
sam_model_type: vit_h
load_ply: False
# whether allow geom training in stage 2
train_geo: False
# prob to invert background color during training (0 = always black, 1 = always white)
invert_bg_prob: 0.5

### GUI
gui: True
device_index: 0
force_cuda_rast: False
# GUI resolution
H: 800
W: 800

### Gaussian splatting
num_pts: 100000
sh_degree: 3
position_lr_init: 0.00016
position_lr_final: 0.0000016
position_lr_delay_mult: 0.01
position_lr_max_steps: 30000
feature_lr: 0.0025
opacity_lr: 0.05
scaling_lr: 0.005
rotation_lr: 0.001
percent_dense: 0.01
density_start_iter: 500
density_end_iter: 15000
densification_interval: 100
opacity_reset_interval: 3000
densify_grad_threshold: 0.0002
lambda_dssim: 0.2

### Textured Mesh
geom_lr: 0.0001
texture_lr: 0.2
